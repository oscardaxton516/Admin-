<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Admin</title>
<style>

:root{--a:#1e40af;--bg:#f4f6fa;--c:#fff;--l:#dde2ec;--t:#101a33;--m:#5b6785}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:72px}
h1,h2,h3,.sn{font-family:Georgia,'Times New Roman',serif}
.h{display:none!important}.mut{color:var(--m);font-size:12.5px}
.pg{min-height:100vh}.wrap{max-width:520px;margin:0 auto;padding:18px}
.lg{width:40px;height:40px;border-radius:10px;background:var(--a);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:700 18px Georgia,serif;overflow:hidden;flex-shrink:0}
.lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand{display:flex;align-items:center;gap:10px}.sn{font-size:16px;font-weight:700;line-height:1.15}
.hero{padding:34px 0 22px}.hero h1{font-size:30px;line-height:1.15;margin:18px 0 10px}
.hero p{color:var(--m);margin-bottom:20px}
.btn{width:100%;background:var(--a);color:#fff;border:0;border-radius:10px;padding:13px;font:600 14px inherit;cursor:pointer;margin-bottom:10px}
.btn.gh{background:none;color:var(--t);border:1px solid var(--l)}.btn.sm{width:auto;padding:7px 14px;margin:0;font-size:12.5px}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{font-size:16px;margin:4px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2{display:flex;gap:8px;margin-top:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;background:#e8edfb;color:var(--a);padding:2px 9px;border-radius:20px}
.ok{color:#15803d;font-weight:700;font-size:13px}.red{color:#b91c1c}
.lk{background:none;border:0;font:600 12px inherit;cursor:pointer;margin-top:8px;padding:0}
label{display:block;font-size:12px;color:var(--m);margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--l);border-radius:9px;padding:11px;font:inherit;background:#fff;color:var(--t)}
textarea{min-height:90px}
.tabs{display:flex;gap:6px;background:#e8ebf3;padding:4px;border-radius:10px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:8px;font:600 12.5px inherit;color:var(--m);cursor:pointer}
.tabs button.on{background:#fff;color:var(--a)}
.err{background:#fde8e8;color:#9b1c1c;border-radius:8px;padding:9px 11px;font-size:12.5px;margin-top:12px}
header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--l);padding:11px 18px;display:flex;justify-content:space-between;align-items:center}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--l);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0;font:600 11.5px inherit;color:var(--m);cursor:pointer}
nav button.on{color:var(--a)}
.sec{margin:18px 0 8px;font-size:18px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat div{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px}.stat b{display:block;font:700 22px Georgia,serif}
body{padding-bottom:0}#admin .wrap{max-width:900px}
</style></head><body>

<script>
const FB={apiKey:"AIzaSyCnAE88d8NOHpMTA94i3Hd9IjWXgK8IMi0",authDomain:"billionaires-prediction.firebaseapp.com",projectId:"billionaires-prediction",storageBucket:"billionaires-prediction.firebasestorage.app",messagingSenderId:"951302460452",appId:"1:951302460452:web:a75b51508739785f6f74b1"};
const ADMINS=["engroscar516@gmail.com","uzodinmachuks677@gmail.com"];
firebase.initializeApp(FB);const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₦'+Number(n||0).toLocaleString();

function show(id){document.querySelectorAll('.pg').forEach(e=>e.classList.add('h'));$(id).classList.remove('h');window.scrollTo(0,0)}
function applyS(){document.documentElement.style.setProperty('--a',S.accent||'#1e40af');document.title=S.name+' Admin';
 document.querySelectorAll('[data-sn]').forEach(e=>e.textContent=S.name);
 document.querySelectorAll('[data-lg]').forEach(e=>e.innerHTML=S.logo?`<img src="${S.logo}" alt="">`:esc((S.name||'O')[0]))}
db.collection('acad_settings').doc('main').get().then(d=>{if(d.exists)Object.assign(S,d.data());applyS()}).catch(applyS);

async function doLogin(){const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});try{await auth.signInWithPopup(pr)}catch(x){if(x.code!=='auth/popup-closed-by-user'&&x.code!=='auth/cancelled-popup-request')err(x.code==='auth/unauthorized-domain'?'This domain is not authorised in Firebase. Add it under Authentication > Settings > Authorized domains.':x.code==='auth/operation-not-allowed'?'Google sign-in is not enabled in Firebase yet.':'Could not sign in with Google. Try again.')}}
auth.onAuthStateChanged(async u=>{
 if(!u){show('login');return}
 if(!ADMINS.includes((u.email||'').toLowerCase())){err('This account does not have admin access.');await auth.signOut();return}
 const r=db.collection('acad_users').doc(u.uid);
 if(!(await r.get()).exists)await r.set({name:u.displayName||'Admin',email:u.email,role:'admin',status:'verified',createdAt:TS()});
 show('admin');adm('users')});
const del=(c,id,cb)=>confirm('Delete this?')&&db.collection(c).doc(id).delete().then(cb);
function adm(t){document.querySelectorAll('#atabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({users:aUsers,courses:aCourses,results:aResults,test:aTest,posts:aPosts,fees:aFees,live:aLive,send:aSend,set:aSet})[t]()}
async function aUsers(){
 const [s,en]=await Promise.all([db.collection('acad_users').get(),db.collection('acad_enroll').get()]);
 const pu={};en.docs.forEach(d=>{const t=d.data().paidUntil;if(t)pu[d.id]=t.toDate()});const now=new Date();
 const us=s.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=='admin').sort((x,y)=>((y.status==='pending')-(x.status==='pending'))||((pu[y.id]>now)?1:0)-((pu[x.id]>now)?1:0));
 const act=us.filter(u=>pu[u.id]>now).length,wait=us.filter(u=>u.status==='pending').length;
 $('adm').innerHTML=`<div class="stat"><div><b>${us.length}</b><span class="mut">Registered</span></div><div><b>${act}</b><span class="mut">Paid and active</span></div><div><b>${wait}</b><span class="mut">Awaiting approval</span></div></div>`+
 (us.map(u=>`<div class="card"><b>${esc(u.name)}</b>${u.test?' <span class="tag">test</span>':''} <span class="tag">${pu[u.id]>now?'Paid until '+pu[u.id].toLocaleDateString():'Not paid'}</span>${u.status==='suspended'?' <span class="tag">suspended</span>':''}${u.status==='pending'?' <span class="tag">awaiting approval</span>':''}<div class="mut">${esc(u.role)} · ${esc(u.cls||'')}<br>${esc(u.email)} · ${esc(u.phone||'')}</div>
 <div class="row2">${u.status==='pending'?`<button class="btn sm" onclick="setSt('${u.id}','verified')">Approve</button><button class="btn sm gh" onclick="setSt('${u.id}','suspended')">Reject</button>`:u.status==='suspended'?`<button class="btn sm" onclick="setSt('${u.id}','verified')">Reactivate</button>`:`<button class="btn sm gh" onclick="setSt('${u.id}','suspended')">Suspend</button>`}</div></div>`).join('')||'<p class="mut">No registrations yet.</p>')}
const setSt=(id,s)=>db.collection('acad_users').doc(id).update({status:s}).then(aUsers);
let PIMG='';function aPosts(){PIMG='';
 $('adm').innerHTML=`<div class="card"><label style="margin-top:0">Title</label><input id="p-t"><label>Category</label><select id="p-c"><option>News</option><option>Event</option><option>Notice</option><option>Academic</option></select><label>Message</label><textarea id="p-b"></textarea><label>Image (optional)</label><input type="file" accept="image/*" onchange="imgUp(this,'post',700)"><div class="mut" id="lg-s"></div><button class="btn" style="margin-top:14px" onclick="addPost()">Publish post</button></div>`}
async function addPost(){if(!$('p-t').value||!$('p-b').value)return alert('Add a title and message.');
 await db.collection('acad_posts').add({title:$('p-t').value,cat:$('p-c').value,body:$('p-b').value,img:PIMG,createdAt:TS()});alert('Published');adm('posts')}
async function aFees(){
 const [f,p,u]=await Promise.all([db.collection('acad_fees').get(),db.collection('acad_payments').get(),db.collection('acad_users').get()]);
 const nm={};u.docs.forEach(d=>nm[d.id]=d.data().name);
 const ps=p.docs.map(d=>d.data()).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
 const tot=ps.reduce((n,x)=>n+(x.amount||0),0);
 $('adm').innerHTML=`<div class="stat"><div><b>${money(tot)}</b><span class="mut">Total received</span></div><div><b>${ps.length}</b><span class="mut">Payments</span></div></div>
 <div class="card"><b>Academy fee</b><div class="mut">Students pay this to enter the hub. You can change it any time.</div><label>Amount (₦)</label><input id="e-a" type="number" value="${S.feeAmount||20000}"><label>Access length (months)</label><input id="e-m" type="number" value="${S.feeMonths||4}"><button class="btn" style="margin-top:14px" onclick="saveEnrol()">Save academy fee</button></div>
 <div class="card"><b>Other fees (optional)</b><label>Fee name</label><input id="f-t" placeholder="e.g. Certificate fee"><label>Amount (₦)</label><input id="f-a" type="number"><button class="btn" style="margin-top:14px" onclick="addFee()">Add fee</button></div>`+
 f.docs.map(d=>{const x=d.data();return `<div class="card row"><div><b>${esc(x.title)}</b><div class="mut">${money(x.amount)}</div></div><button class="lk red" onclick="del('acad_fees','${d.id}',aFees)">Delete</button></div>`}).join('')+
 '<h2 class="sec">Who has paid</h2>'+(ps.slice(0,50).map(x=>`<div class="card row"><div><b>${esc(nm[x.uid]||'Unknown')}</b><div class="mut">${esc(x.title)} · ${dt(x.createdAt)}</div></div><b>${money(x.amount)}</b></div>`).join('')||'<p class="mut">No payments yet.</p>')}
async function saveEnrol(){const m=Number($('e-m').value),v=Number($('e-a').value);if(!v||!m)return alert('Enter the amount and months.');S.feeAmount=v;S.feeMonths=m;await db.collection('acad_settings').doc('main').set(S);alert('Saved. The new amount applies to the next payment.')}
async function aLive(){
 const [l,j]=await Promise.all([db.collection('acad_links').get(),db.collection('acad_joins').get()]);
 const jn={};j.docs.forEach(d=>{const x=d.data();(jn[x.linkId]=jn[x.linkId]||[]).push(x)});
 const cl=(S.classes||'').split(',').map(c=>c.trim()).filter(Boolean);
 const L=l.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
 $('adm').innerHTML=`<div class="card"><label style="margin-top:0">Class title</label><input id="l-t" placeholder="e.g. Cyber Security, week 1"><label>Platform</label><select id="l-k"><option>Zoom</option><option>WhatsApp</option><option>Google Meet</option><option>YouTube</option><option>Other</option></select><label>Link</label><input id="l-u" type="url" placeholder="https://"><label>Date and time</label><input id="l-w" placeholder="e.g. Saturday 4pm"><label>For</label><select id="l-c"><option value="all">All students</option>${cl.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn" style="margin-top:14px" onclick="addLive()">Share class link</button></div>`+
 L.map(x=>{const J=jn[x.id]||[];return `<div class="card"><div class="row"><div><b>${esc(x.title)}</b><div class="mut">${esc(x.kind)} · ${esc(x.when||'')} · ${esc(x.course==='all'?'All students':x.course)}</div></div><button class="lk red" onclick="del('acad_links','${x.id}',aLive)">Delete</button></div><details><summary class="mut" style="cursor:pointer">${J.length} joined</summary><div class="mut">${J.map(y=>esc(y.name)).join(', ')||'No one yet.'}</div></details></div>`}).join('')}
async function addLive(){const u=$('l-u').value.trim();if(!$('l-t').value||!/^https?:\/\//.test(u))return alert('Add a title and a full link starting with https://');
 await db.collection('acad_links').add({title:$('l-t').value,kind:$('l-k').value,url:u,when:$('l-w').value,course:$('l-c').value,createdAt:TS()});aLive()}
async function addFee(){const a=Number($('f-a').value);if(!$('f-t').value||!a)return alert('Enter a fee name and amount.');
 await db.collection('acad_fees').add({title:$('f-t').value,amount:a,createdAt:TS()});aFees()}
function aSet(){
 $('adm').innerHTML=`<div class="card"><label style="margin-top:0">School logo</label><input type="file" accept="image/*" onchange="imgUp(this,'logo',240)"><label>Landing page photo</label><input type="file" accept="image/*" onchange="imgUp(this,'heroImg',900)"><div class="mut" id="lg-s"></div>
 <label>School name</label><input id="s-n" value="${esc(S.name)}"><label>Tagline</label><input id="s-t" value="${esc(S.tagline)}">
 <label>School phone</label><input id="s-ph" value="${esc(S.phone||'')}"><label>School email</label><input id="s-em" value="${esc(S.email||'')}"><label>Address</label><input id="s-ad" value="${esc(S.address||'')}">
 <label>About the school (landing page)</label><textarea id="s-ab">${esc(S.about||'')}</textarea>
 <label>Brand colour</label><input id="s-ac" type="color" value="${S.accent||'#1e40af'}" style="height:44px;padding:4px">
 <label>Classes (comma separated)</label><textarea id="s-cl">${esc(S.classes)}</textarea>
 <label>Paystack public key</label><input id="s-pk" value="${esc(S.paystackKey||'')}" placeholder="pk_live_..."><button class="btn" style="margin-top:14px" onclick="saveSet()">Save settings</button></div>`}
function imgUp(inp,k,max){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
 const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
 const v=k==='logo'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.8);if(k==='post')PIMG=v;else S[k]=v;$('lg-s').textContent='Image ready.'+(k==='post'?'':' Tap Save settings.')};i.src=r.result};r.readAsDataURL(f)}
async function saveSet(){
 Object.assign(S,{name:$('s-n').value,tagline:$('s-t').value,about:$('s-ab').value,phone:$('s-ph').value,email:$('s-em').value,address:$('s-ad').value,accent:$('s-ac').value,classes:$('s-cl').value,paystackKey:$('s-pk').value.trim()});
 await db.collection('acad_settings').doc('main').set(S);applyS();alert('Settings saved')}

async function aSend(){
 const [u,i]=await Promise.all([db.collection('acad_users').where('status','==','verified').get(),db.collection('acad_items').get()]);
 const cl=(S.classes||'').split(',').map(c=>c.trim()).filter(Boolean);
 const L=i.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,30);
 $('adm').innerHTML=`<div class="card"><label style="margin-top:0">Type</label><select id="i-ty"><option value="lesson">Lesson / material</option><option value="homework">Homework</option><option value="timetable">Timetable</option><option value="result">Result</option><option value="message">Message</option></select>
 <label>Send to</label><select id="i-to"><option value="all">Everyone</option>${cl.map(c=>`<option value="${esc(c)}">Class: ${esc(c)}</option>`).join('')}${u.docs.filter(d=>d.data().role!=='admin').map(d=>`<option value="${d.id}">${esc(d.data().name)} (${esc(d.data().cls||d.data().role)})</option>`).join('')}</select>
 <label>Title</label><input id="i-t"><label>Details</label><textarea id="i-b"></textarea><button class="btn" style="margin-top:14px" onclick="addItem()">Send</button></div>`+
 L.map(x=>`<div class="card row"><div><b>${esc(x.title)}</b><div class="mut">${esc(x.type)} · to ${esc(x.toName||x.to)}</div></div><button class="lk red" onclick="del('acad_items','${x.id}',aSend)">Delete</button></div>`).join('')}
async function addItem(){if(!$('i-t').value||!$('i-b').value)return alert('Add a title and details.');
 const o=$('i-to');await db.collection('acad_items').add({type:$('i-ty').value,to:o.value,toName:o.selectedOptions[0].text,title:$('i-t').value,body:$('i-b').value,createdAt:TS()});alert('Sent');aSend()}

const API="https://billionaires-prediction-backend.onrender.com",CK=c=>c.replace(/[^A-Za-z0-9]+/g,'_').slice(0,80);
let CL=[],CE=null;
async function api(path,body){const t=await auth.currentUser.getIdToken();const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Something went wrong. Try again.');return j}
async function aCourses(){CL=(S.classes||'').split(',').map(c=>c.trim()).filter(Boolean);
 const ds=await Promise.all(CL.map(c=>db.collection('acad_courses').doc(CK(c)).get()));
 $('adm').innerHTML=`<div class="card"><label style="margin-top:0">New course name</label><input id="nc"><button class="btn" style="margin-top:12px" onclick="addCourse()">Add course</button></div>`+
 CL.map((c,i)=>{const n=ds[i].exists?(ds[i].data().topics||[]).length:0;return `<div class="card row"><div><b>${esc(c)}</b><div class="mut">${n} topic${n===1?'':'s'}${n?'':' · not built yet'}</div></div><button class="btn sm" onclick="editCourse(${i})">Manage</button></div>`}).join('')}
async function addCourse(){const n=$('nc').value.trim();if(!n)return;if(CL.includes(n))return alert('That course already exists.');
 S.classes=[...CL,n].join(',');await db.collection('acad_settings').doc('main').set({classes:S.classes},{merge:true});aCourses()}
async function editCourse(i){const name=CL[i],d=await db.collection('acad_courses').doc(CK(name)).get(),x=d.exists?d.data():{};
 CE={name,desc:x.desc||'',ai:x.ai||'',topics:(x.topics||[]).map(t=>typeof t==='string'?{t,body:'',video:''}:{t:t.t||'',body:t.body||'',video:t.video||''})};drawCE()}
function drawCE(){$('adm').innerHTML=`<button class="lk" onclick="aCourses()">‹ All courses</button>
 <div class="card"><h3>${esc(CE.name)}</h3><label>Description (students see this)</label><textarea oninput="CE.desc=this.value">${esc(CE.desc)}</textarea>
 <label>AI teacher instructions (optional: how the AI should teach this course)</label><textarea oninput="CE.ai=this.value">${esc(CE.ai)}</textarea></div>
 <div class="card"><b>Topics</b><div class="mut">Students learn them in this order. Add your own lesson text and a video or resource link; the AI teaches from your lesson. Changing the order after students have started can shift their progress.</div>
 ${CE.topics.map((t,i)=>`<div class="card" style="margin:10px 0 0"><div class="row"><b>Topic ${i+1}</b><span><button class="lk" onclick="mvT(${i},-1)">Up</button><button class="lk" onclick="mvT(${i},1)">Down</button><button class="lk red" onclick="rmT(${i})">Remove</button></span></div>
 <label>Title</label><input value="${esc(t.t)}" oninput="CE.topics[${i}].t=this.value"><label>Your lesson (optional)</label><textarea style="min-height:120px" oninput="CE.topics[${i}].body=this.value">${esc(t.body)}</textarea>
 <label>Video or resource link (optional)</label><input value="${esc(t.video)}" oninput="CE.topics[${i}].video=this.value"><button class="btn sm gh" style="margin-top:8px" onclick="draftT(${i})">Draft lesson with AI</button></div>`).join('')}
 <div style="display:flex;gap:8px;margin-top:12px"><button class="btn sm gh" onclick="addT()">Add topic</button><button class="btn sm gh" onclick="genT()">Generate topics with AI</button></div></div>
 <button class="btn" onclick="saveCE()">Save course</button><button class="btn gh" onclick="delCourse()">Delete course</button>`}
const addT=()=>{CE.topics.push({t:'',body:'',video:''});drawCE()};
const rmT=i=>{if(confirm('Remove this topic?')){CE.topics.splice(i,1);drawCE()}};
const mvT=(i,d)=>{const j=i+d;if(j<0||j>=CE.topics.length)return;[CE.topics[i],CE.topics[j]]=[CE.topics[j],CE.topics[i]];drawCE()};
async function genT(){if(CE.topics.length&&!confirm('Replace the current topics (and your lesson text) with an AI-generated list?'))return;
 try{const j=await api('/admin/outline',{course:CE.name,count:12});CE.topics=j.topics.map(t=>({t,body:'',video:''}));drawCE()}catch(e){alert(e.message)}}
async function draftT(i){if(!CE.topics[i].t.trim())return alert('Give the topic a title first.');
 try{const j=await api('/admin/lesson',{course:CE.name,title:CE.topics[i].t});CE.topics[i].body=j.body;drawCE()}catch(e){alert(e.message)}}
async function saveCE(){const tp=CE.topics.filter(t=>t.t.trim());await db.collection('acad_courses').doc(CK(CE.name)).set({course:CE.name,desc:CE.desc,ai:CE.ai,topics:tp,updatedAt:TS()},{merge:true});alert('Saved');CE.topics=tp;drawCE()}
async function delCourse(){if(!confirm('Delete this course and its topics? Students already registered for it will keep their account.'))return;
 S.classes=CL.filter(c=>c!==CE.name).join(',');await db.collection('acad_settings').doc('main').set({classes:S.classes},{merge:true});await db.collection('acad_courses').doc(CK(CE.name)).delete();aCourses()}
async function aResults(){const s=await db.collection('acad_quiz_results').orderBy('createdAt','desc').limit(100).get();
 $('adm').innerHTML=s.empty?'<p class="mut">No quiz results yet.</p>':s.docs.map(d=>{const x=d.data();return `<div class="card row"><div><b>${esc(x.name)}</b><div class="mut">${esc(x.course)} · Topic ${x.topic}: ${esc(x.title)}<br>${dt(x.createdAt)}</div></div><div style="text-align:right"><b>${x.score}/${x.total}</b><br><span class="tag">${x.passed?'Passed':'Not yet'}</span></div></div>`}).join('')}

function tsBox(j,h){return `<div class="card" style="border:1px solid var(--a)"><b>${h}</b><div style="margin-top:6px">Site: ${esc(location.href.replace(/admin\.html.*$/,''))}<br>Email: <b>${esc(j.email)}</b><br>Password: <b>${esc(j.password)}</b></div><div class="mut">Open the student site in a private window and log in with these details. Copy them now; the password is not shown again.</div></div>`}
async function aTest(){CL=(S.classes||'').split(',').map(c=>c.trim()).filter(Boolean);
 const s=await db.collection('acad_users').where('test','==',true).get();
 $('adm').innerHTML=`<div class="card"><b>Test students</b><div class="mut">Create a practice student to see exactly what your students see. Make two in the same course to test the class chat.</div>
 <label>Course</label><select id="ts-c">${CL.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
 <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="ts-b" checked style="width:auto">Skip payment and approval</label>
 <div class="mut">Untick it to test the real flow: the student must pay and wait for your approval.</div>
 <button class="btn" style="margin-top:12px" onclick="mkTest()">Create test student</button></div><div id="ts-o"></div>`+
 s.docs.map(d=>{const x=d.data();return `<div class="card row"><div><b>${esc(x.name)}</b> <span class="tag">${esc(x.status)}</span><div class="mut">${esc(x.cls||'')} · ${esc(x.email)}</div></div><div><button class="btn sm gh" onclick="tsAct('reset','${d.id}')">New password</button><button class="lk red" onclick="tsAct('delete','${d.id}')">Delete</button></div></div>`}).join('')}
async function mkTest(){try{const j=await api('/admin/test-student',{action:'create',course:$('ts-c').value,bypass:$('ts-b').checked});await aTest();$('ts-o').innerHTML=tsBox(j,'Test student created')}catch(e){alert(e.message)}}
async function tsAct(a,uid){if(a==='delete'&&!confirm('Delete this test student?'))return;try{const j=await api('/admin/test-student',{action:a,uid});await aTest();if(a==='reset')$('ts-o').innerHTML=tsBox(j,'New password set')}catch(e){alert(e.message)}}
</script></body></html>
