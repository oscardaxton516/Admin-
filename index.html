<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>

:root{--a:#1e40af;--bg:#f4f6fa;--c:#fff;--l:#dde2ec;--t:#101a33;--m:#5b6785}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:72px}
h1,h2,h3,.sn{font-family:Georgia,'Times New Roman',serif}
.h{display:none!important}.mut{color:var(--m);font-size:12.5px}
.pg{min-height:100vh}.wrap{max-width:520px;margin:0 auto;padding:18px}
.lg{width:40px;height:40px;border-radius:10px;background:var(--a);color:#fff;display:inline-flex;align-items:center;justify-content:center;font:700 18px Georgia,serif;overflow:hidden;flex-shrink:0}
.lg img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand{display:flex;align-items:center;gap:10px}.sn{font-size:16px;font-weight:700;line-height:1.15}
.hero{padding:34px 0 22px}.hero h1{font-size:30px;line-height:1.15;margin:18px 0 10px}
.hero p{color:var(--m);margin-bottom:20px}
.btn{width:100%;background:var(--a);color:#fff;border:0;border-radius:10px;padding:13px;font:600 14px inherit;cursor:pointer;margin-bottom:10px}
.btn.gh{background:none;color:var(--t);border:1px solid var(--l)}.btn.sm{width:auto;padding:7px 14px;margin:0;font-size:12.5px}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:14px;margin-bottom:10px}
.card h3{font-size:16px;margin:4px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row2{display:flex;gap:8px;margin-top:10px}
.tag{display:inline-block;font-size:11px;font-weight:600;background:#e8edfb;color:var(--a);padding:2px 9px;border-radius:20px}
.ok{color:#15803d;font-weight:700;font-size:13px}.red{color:#b91c1c}
.lk{background:none;border:0;font:600 12px inherit;cursor:pointer;margin-top:8px;padding:0}
label{display:block;font-size:12px;color:var(--m);margin:12px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--l);border-radius:9px;padding:11px;font:inherit;background:#fff;color:var(--t)}
textarea{min-height:90px}
.tabs{display:flex;gap:6px;background:#e8ebf3;padding:4px;border-radius:10px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:8px;font:600 12.5px inherit;color:var(--m);cursor:pointer}
.tabs button.on{background:#fff;color:var(--a)}
.err{background:#fde8e8;color:#9b1c1c;border-radius:8px;padding:9px 11px;font-size:12.5px;margin-top:12px}
header{position:sticky;top:0;z-index:5;background:var(--c);border-bottom:1px solid var(--l);padding:11px 18px;display:flex;justify-content:space-between;align-items:center}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--l);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0;font:600 11.5px inherit;color:var(--m);cursor:pointer}
nav button.on{color:var(--a)}
.sec{margin:18px 0 8px;font-size:18px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat div{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px}.stat b{display:block;font:700 22px Georgia,serif}
body{padding-bottom:0}#admin .wrap{max-width:900px}
</style></head><body>
<div class="pg" id="login"><div class="wrap" style="padding-top:70px">
 <div class="brand"><span class="lg" data-lg></span><span class="sn" data-sn></span></div>
 <h2 style="margin:18px 0 4px">Admin sign in</h2><p class="mut">For school staff only.</p>
 <div id="a-err" class="err h"></div>
 <button class="btn" id="gbtn" style="margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px" onclick="doLogin()"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#fff" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/></svg>Continue with Google</button></div></div>
<div class="pg h" id="admin">
 <header><div class="brand"><span class="lg" data-lg></span><span class="sn">Admin dashboard</span></div><button class="lk" onclick="auth.signOut()" style="margin:0">Log out</button></header>
 <div class="wrap"><div class="tabs" style="flex-wrap:wrap" id="atabs"><button data-t="users" onclick="adm('users')">Users</button><button data-t="posts" onclick="adm('posts')">Posts</button><button data-t="fees" onclick="adm('fees')">Fees</button><button data-t="send" onclick="adm('send')">Send</button><button data-t="set" onclick="adm('set')">Settings</button></div><div id="adm"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const FB={apiKey:"AIzaSyCnAE88d8NOHpMTA94i3Hd9IjWXgK8IMi0",authDomain:"billionaires-prediction.firebaseapp.com",projectId:"billionaires-prediction",storageBucket:"billionaires-prediction.firebasestorage.app",messagingSenderId:"951302460452",appId:"1:951302460452:web:a75b51508739785f6f74b1"};
const ADMINS=["engroscar516@gmail.com","uzodinmachuks677@gmail.com"];
firebase.initializeApp(FB);const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₦'+Number(n||0).toLocaleString();
const dt=x=>x&&x.toDate?x.toDate().toLocaleDateString():'';
let S={name:'Oscar Daxton Academy',tagline:'School Portal',classes:'Nursery 1,Nursery 2,Primary 1,Primary 2,Primary 3,Primary 4,Primary 5,Primary 6,JSS 1,JSS 2,JSS 3,SS 1,SS 2,SS 3'};
function show(id){document.querySelectorAll('.pg').forEach(e=>e.classList.add('h'));$(id).classList.remove('h');window.scrollTo(0,0)}
function applyS(){document.documentElement.style.setProperty('--a',S.accent||'#1e40af');document.title=S.name+' Admin';
 document.querySelectorAll('[data-sn]').forEach(e=>e.textContent=S.name);
 document.querySelectorAll('[data-lg]').forEach(e=>e.innerHTML=S.logo?`<img src="${S.logo}" alt="">`:esc((S.name||'O')[0]))}
db.collection('acad_settings').doc('main').get().then(d=>{if(d.exists)Object.assign(S,d.data());applyS()}).catch(applyS);
function err(m){const e=$('a-err');e.textContent=m;e.classList.remove('h')}
async function doLogin(){const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});try{await auth.signInWithPopup(pr)}catch(x){if(x.code!=='auth/popup-closed-by-user'&&x.code!=='auth/cancelled-popup-request')err(x.code==='auth/unauthorized-domain'?'This domain is not authorised in Firebase. Add it under Authentication > Settings > Authorized domains.':x.code==='auth/operation-not-allowed'?'Google sign-in is not enabled in Firebase yet.':'Could not sign in with Google. Try again.')}}
auth.onAuthStateChanged(async u=>{
 if(!u){show('login');return}
 if(!ADMINS.includes((u.email||'').toLowerCase())){err('This account does not have admin access.');await auth.signOut();return}
 const r=db.collection('acad_users').doc(u.uid);
 if(!(await r.get()).exists)await r.set({name:u.displayName||'Admin',email:u.email,role:'admin',status:'verified',createdAt:TS()});
 show('admin');adm('users')});
const del=(c,id,cb)=>confirm('Delete this?')&&db.collection(c).doc(id).delete().then(cb);
function adm(t){document.querySelectorAll('#atabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({users:aUsers,posts:aPosts,fees:aFees,send:aSend,set:aSet})[t]()}
async function aUsers(){
 const s=await db.collection('acad_users').get();
 const us=s.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=='admin').sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1));
 $('adm').innerHTML=`<div class="stat"><div><b>${us.length}</b><span class="mut">Registered</span></div><div><b>${us.filter(u=>u.status==='pending').length}</b><span class="mut">Awaiting verification</span></div></div>`+
 (us.map(u=>`<div class="card"><b>${esc(u.name)}</b> <span class="tag">${esc(u.status)}</span><div class="mut">${esc(u.role)} ${esc(u.cls||'')}<br>${esc(u.email)} · ${esc(u.phone||'')}</div>
 <div class="row2"><button class="btn sm" onclick="setSt('${u.id}','verified')">Verify</button><button class="btn sm gh" onclick="setSt('${u.id}','suspended')">Suspend</button></div></div>`).join('')||'<p class="mut">No registrations yet.</p>')}
const setSt=(id,s)=>db.collection('acad_users').doc(id).update({status:s}).then(aUsers);
function aPosts(){
 $('adm').innerHTML=`<div class="card"><label style="margin-top:0">Title</label><input id="p-t"><label>Category</label><select id="p-c"><option>News</option><option>Event</option><option>Notice</option><option>Academic</option></select><label>Message</label><textarea id="p-b"></textarea><button class="btn" style="margin-top:14px" onclick="addPost()">Publish post</button></div>`}
async function addPost(){if(!$('p-t').value||!$('p-b').value)return alert('Add a title and message.');
 await db.collection('acad_posts').add({title:$('p-t').value,cat:$('p-c').value,body:$('p-b').value,createdAt:TS()});alert('Published');adm('posts')}
async function aFees(){
 const [f,p]=await Promise.all([db.collection('acad_fees').get(),db.collection('acad_payments').get()]);
 const tot=p.docs.reduce((n,d)=>n+(d.data().amount||0),0);
 $('adm').innerHTML=`<div class="stat"><div><b>${money(tot)}</b><span class="mut">Total received</span></div><div><b>${p.size}</b><span class="mut">Payments</span></div></div>
 <div class="card"><label style="margin-top:0">Fee name</label><input id="f-t" placeholder="e.g. First term tuition"><label>Amount (₦)</label><input id="f-a" type="number"><button class="btn" style="margin-top:14px" onclick="addFee()">Add fee</button></div>`+
 f.docs.map(d=>{const x=d.data();return `<div class="card row"><div><b>${esc(x.title)}</b><div class="mut">${money(x.amount)}</div></div><button class="lk red" onclick="del('acad_fees','${d.id}',aFees)">Delete</button></div>`}).join('')}
async function addFee(){const a=Number($('f-a').value);if(!$('f-t').value||!a)return alert('Enter a fee name and amount.');
 await db.collection('acad_fees').add({title:$('f-t').value,amount:a,createdAt:TS()});aFees()}
function aSet(){
 $('adm').innerHTML=`<div class="card"><label style="margin-top:0">School logo</label><input type="file" accept="image/*" onchange="logo(this)"><div class="mut" id="lg-s"></div>
 <label>School name</label><input id="s-n" value="${esc(S.name)}"><label>Tagline</label><input id="s-t" value="${esc(S.tagline)}">
 <label>School phone</label><input id="s-ph" value="${esc(S.phone||'')}"><label>School email</label><input id="s-em" value="${esc(S.email||'')}"><label>Address</label><input id="s-ad" value="${esc(S.address||'')}">
 <label>About the school (landing page)</label><textarea id="s-ab">${esc(S.about||'')}</textarea>
 <label>Brand colour</label><input id="s-ac" type="color" value="${S.accent||'#1e40af'}" style="height:44px;padding:4px">
 <label>Classes (comma separated)</label><textarea id="s-cl">${esc(S.classes)}</textarea>
 <label>Paystack public key</label><input id="s-pk" value="${esc(S.paystackKey||'')}" placeholder="pk_live_..."><button class="btn" style="margin-top:14px" onclick="saveSet()">Save settings</button></div>`}
function logo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
 const k=Math.min(1,240/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
 S.logo=c.toDataURL('image/png');$('lg-s').textContent='Logo ready — tap Save settings.'};i.src=r.result};r.readAsDataURL(f)}
async function saveSet(){
 Object.assign(S,{name:$('s-n').value,tagline:$('s-t').value,about:$('s-ab').value,phone:$('s-ph').value,email:$('s-em').value,address:$('s-ad').value,accent:$('s-ac').value,classes:$('s-cl').value,paystackKey:$('s-pk').value.trim()});
 await db.collection('acad_settings').doc('main').set(S);applyS();alert('Settings saved')}

async function aSend(){
 const [u,i]=await Promise.all([db.collection('acad_users').where('status','==','verified').get(),db.collection('acad_items').get()]);
 const cl=(S.classes||'').split(',').map(c=>c.trim()).filter(Boolean);
 const L=i.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)).slice(0,30);
 $('adm').innerHTML=`<div class="card"><label style="margin-top:0">Type</label><select id="i-ty"><option value="homework">Homework</option><option value="timetable">Timetable</option><option value="result">Result</option><option value="message">Message</option></select>
 <label>Send to</label><select id="i-to"><option value="all">Everyone</option>${cl.map(c=>`<option value="${esc(c)}">Class: ${esc(c)}</option>`).join('')}${u.docs.filter(d=>d.data().role!=='admin').map(d=>`<option value="${d.id}">${esc(d.data().name)} (${esc(d.data().cls||d.data().role)})</option>`).join('')}</select>
 <label>Title</label><input id="i-t"><label>Details</label><textarea id="i-b"></textarea><button class="btn" style="margin-top:14px" onclick="addItem()">Send</button></div>`+
 L.map(x=>`<div class="card row"><div><b>${esc(x.title)}</b><div class="mut">${esc(x.type)} · to ${esc(x.toName||x.to)}</div></div><button class="lk red" onclick="del('acad_items','${x.id}',aSend)">Delete</button></div>`).join('')}
async function addItem(){if(!$('i-t').value||!$('i-b').value)return alert('Add a title and details.');
 const o=$('i-to');await db.collection('acad_items').add({type:$('i-ty').value,to:o.value,toName:o.selectedOptions[0].text,title:$('i-t').value,body:$('i-b').value,createdAt:TS()});alert('Sent');aSend()}
</script></body></html>
