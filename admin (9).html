 <header><div class="brand"><span class="lg" data-lg></span><span class="sn">Admin dashboard</span></div><button class="lk" onclick="auth.signOut()" style="margin:0">Log out</button></header>
 <div class="wrap"><div class="tabs" id="atabs"><button data-t="home" onclick="adm('home')">Overview</button><button data-t="users" onclick="adm('users')">Users</button><button data-t="courses" onclick="adm('courses')">Courses</button><button data-t="teachers" onclick="adm('teachers')">Teachers</button><button data-t="results" onclick="adm('results')">Results</button><button data-t="test" onclick="adm('test')">Test student</button><button data-t="posts" onclick="adm('posts')">Posts</button><button data-t="fees" onclick="adm('fees')">Fees</button><button data-t="live" onclick="adm('live')">Live</button><button data-t="send" onclick="adm('send')">Send</button><button data-t="set" onclick="adm('set')">Settings</button></div><div id="adm"></div></div></div>

<script>
const FB={apiKey:"AIzaSyCnAE88d8NOHpMTA94i3Hd9IjWXgK8IMi0",authDomain:"billionaires-prediction.firebaseapp.com",projectId:"billionaires-prediction",storageBucket:"billionaires-prediction.firebasestorage.app",messagingSenderId:"951302460452",appId:"1:951302460452:web:a75b51508739785f6f74b1"};
const ADMINS=["engroscar516@gmail.com","uzodinmachuks677@gmail.com"];
firebase.initializeApp(FB);const auth=firebase.auth(),db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₦'+Number(n||0).toLocaleString();
const dt=x=>x&&x.toDate?x.toDate().toLocaleDateString():'';
const CLIST=s=>(s||'').split(/[,\n;|]+/).map(x=>x.trim()).filter(Boolean);
let S={name:'Oscar Daxton Academy',tagline:'School Portal',classes:'Computer Repair,Software Installation,Graphic Design,Cyber Security,Cloud Infrastructure,Computer Networking,Digital Technology,CCTV & Smart Devices,Programming & Development,Electronics & IoT,Forex & Financial Education'};
function show(id){document.querySelectorAll('.pg').forEach(e=>e.classList.add('h'));$(id).classList.remove('h');window.scrollTo(0,0)}
function applyS(){document.documentElement.style.setProperty('--a',S.accent||'#1e40af');document.title=S.name+' Admin';
 document.querySelectorAll('[data-sn]').forEach(e=>e.textContent=S.name);
 document.querySelectorAll('[data-lg]').forEach(e=>e.innerHTML=S.logo?`<img src="${S.logo}" alt="">`:esc((S.name||'O')[0]))}
db.collection('acad_settings').doc('main').get().then(d=>{if(d.exists)Object.assign(S,d.data());applyS()}).catch(applyS);
function err(m){const e=$('a-err');e.textContent=m;e.classList.remove('h')}
async function doLogin(){const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});try{await auth.signInWithPopup(pr)}catch(x){if(x.code!=='auth/popup-closed-by-user'&&x.code!=='auth/cancelled-popup-request')err(x.code==='auth/unauthorized-domain'?'This domain is not authorised in Firebase. Add it under Authentication > Settings > Authorized domains.':x.code==='auth/operation-not-allowed'?'Google sign-in is not enabled in Firebase yet.':'Could not sign in with Google. Try again.')}}
auth.onAuthStateChanged(async u=>{
 if(!u){show('login');return}
 if(!ADMINS.includes((u.email||'').toLowerCase())){err('This account does not have admin access.');await auth.signOut();return}
 const r=db.collection('acad_users').doc(u.uid);
 if(!(await r.get()).exists)await r.set({name:u.displayName||'Admin',email:u.email,role:'admin',status:'verified',createdAt:TS()});
 show('admin');adm('home');api('/admin/cleanup',{}).catch(()=>{})});
const del=(c,id,cb)=>confirm('Delete this?')&&db.collection(c).doc(id).delete().then(cb);
function adm(t){document.querySelectorAll('#atabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));Promise.resolve(({home:aHome,users:aUsers,courses:aCourses,teachers:aTeachers,results:aResults,test:aTest,posts:aPosts,fees:aFees,live:aLive,send:aSend,set:aSet})[t]()).catch(e=>{$('adm').innerHTML='<div class="card"><b class="red">Could not load this page</b><div class="mut">'+esc(e.message)+'</div><div class="mut" style="margin-top:6px">If this says permissions, update your Firestore rules.</div></div>'})}
async function aUsers(){
 const [s,en]=await Promise.all([db.collection('acad_users').get(),db.collection('acad_enroll').get()]);
 const pu={};en.docs.forEach(d=>{const t=d.data().paidUntil;if(t)pu[d.id]=t.toDate()});const now=new Date();
 const us=s.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.role!=='admin').sort((x,y)=>((y.status==='pending')-(x.status==='pending'))||((pu[y.id]>now)?1:0)-((pu[x.id]>now)?1:0));
 const act=us.filter(u=>pu[u.id]>now).length,wait=us.filter(u=>u.status==='pending').length;
 $('adm').innerHTML=`<div class="stat"><div><b>${us.length}</b><span class="mut">Registered</span></div><div><b>${act}</b><span class="mut">Paid and active</span></div><div><b>${wait}</b><span class="mut">Awaiting approval</span></div></div>`+
 (us.map(u=>`<div class="card"><b>${esc(u.name)}</b>${u.test?' <span class="tag">test</span>':''} <span class="tag">${pu[u.id]>now?'Paid until '+pu[u.id].toLocaleDateString():'Not paid'}</span>${u.status==='suspended'?' <span class="tag">suspended</span>':''}${u.status==='pending'?' <span class="tag">awaiting approval</span>':''}<div class="mut">${esc(u.role)} · ${esc(u.cls||'')}<br>${esc(u.email)} · ${esc(u.phone||'')}</div>
 <div class="row2">${u.status==='pending'?`<button class="btn sm" onclick="setSt('${u.id}','verified')">Approve</button><button class="btn sm gh" onclick="setSt('${u.id}','suspended')">Reject</button>`:u.status==='suspended'?`<button class="btn sm" onclick="setSt('${u.id}','verified')">Reactivate</button>`:`<button class="btn sm gh" onclick="setSt('${u.id}','suspended')">Suspend</button>`}</div></div>`).join('')||'<p class="mut">No registrations yet.</p>')}
const setSt=(id,s)=>db.collection('acad_users').doc(id).update({status:s}).then(aUsers);
let PM=[];
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Could not read the file.'));r.readAsDataURL(f)});
const shrink=f=>readFile(f).then(src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};i.onerror=()=>rej(new Error('Could not read an image.'));i.src=src}));
async function putMedia(f){const data=await shrink(f);if(data.length>900000)throw new Error('An image is too large.');
 const r=await db.collection('acad_media').add({data,kind:'image',name:f.name||'image',size:f.size,by:auth.currentUser.uid,createdAt:TS(),expireAt:firebase.firestore.Timestamp.fromMillis(Date.now()+21*864e5)});return {id:r.id}}
async function aPosts(){PM=[];const s=await db.collection('acad_posts').orderBy('createdAt','desc').limit(20).get();
 $('adm').innerHTML=`<div class="card"><label style="margin-top:0">Title</label><input id="p-t"><label>Category</label><select id="p-c"><option>News</option><option>Event</option><option>Notice</option><option>Academic</option></select><label>Message</label><textarea id="p-b"></textarea><label>Images (optional, up to 4)</label><input type="file" id="p-f" accept="image/*" multiple onchange="pickImgs(this)"><div class="mut" id="p-pv">Images are deleted automatically after 21 days. The text stays.</div><button class="btn" id="p-bt" style="margin-top:14px" onclick="addPost()">Publish post</button></div>`+
 s.docs.map(d=>{const x=d.data();return `<div class="card row"><div><b>${esc(x.title)}</b><div class="mut">${esc(x.cat)} · ${dt(x.createdAt)}${(x.media||[]).length?' · '+x.media.length+' image(s)':''}</div></div><button class="lk red" onclick="del('acad_posts','${d.id}',aPosts)">Delete</button></div>`}).join('')}
async function pickImgs(i){const fs=[...i.files].slice(0,4);$('p-pv').textContent='Preparing images...';$('p-bt').disabled=true;
 try{PM=await Promise.all(fs.map(putMedia));$('p-pv').textContent=PM.length+' image(s) ready'}catch(e){PM=[];alert(e.message);$('p-pv').textContent=''}$('p-bt').disabled=false}
async function addPost(){if(!$('p-t').value||!$('p-b').value)return alert('Add a title and message.');
 await db.collection('acad_posts').add({title:$('p-t').value,cat:$('p-c').value,body:$('p-b').value,img:'',media:PM.map(m=>({id:m.id})),createdAt:TS()});alert('Published');adm('posts')}
async function aFees(){
 const [f,p,u]=await Promise.all([db.collection('acad_fees').get(),db.collection('acad_payments').get(),db.collection('acad_users').get()]);
 const nm={};u.docs.forEach(d=>nm[d.id]=d.data().name);
 const ps=p.docs.map(d=>d.data()).sort((x,y)=>(y.createdAt?.seconds||0)-(x.createdAt?.seconds||0));
 const tot=ps.reduce((n,x)=>n+(x.amount||0),0);
